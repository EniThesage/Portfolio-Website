<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" sizes="35x35" href="">
  <title>Document</title>
  <link rel="stylesheet" href="css/styles.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body class="container-fluid secondary">
  <nav class="navbar navbar navbar-expand-lg fixed-top bg-white shadow-sm">
    <div class="container">

      <!---Brand logo-->
        <a class="navbar-brand" href="#">
          <img src="" alt="" width="50"/>
        </a>

      <!----Toggle button-->
        <button class="navbar-toggler ms-auto" type="button" data-bs-toggle="offcanvas" data-bs-target="#mobileNav" aria-controls="mobileNav"
        aria-expanded="false"
        aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>

      <!----Navigation section-->
        <div class="collapse navbar-collapse mt-3 mt-lg-0" id="navbarNav">
          <ul class="navbar-nav ms-auto gap-lg-3 align-items-lg-center">
            <li class="nav-item">
              <a href="#" class="nav-link active"></a>
            </li>
            <li class="nav-item">
              <a href="#" class="nav-link"></a>
            </li>
            <li class="nav-item">
              <a href="#" class="nav-link"></a>
            </li>
            <li class="nav-item">
              <a href="#" class="nav-link"></a>
            </li>
            <li class="nav-item">
              <a href="#" class="nav-link"></a>
            </li>
          </ul>
        </div>
    </div>
  </nav>

      <!---offcanvas section---> 
        <div class="offcanvas offcanvas-end" tabindex="-1" id="mobileNav">
          <div class="offcanvas-header">
            <h5 class="offcanvas-title">
              Menu
            </h5>
              <button type="button" class="btn-close" data-bs-dismiss="offcanvas"></button>
          </div>

          <div class="offcanvas-body">
            <ul class="navbar-nav text-center gap-4">
              <li class="nav-item"><a class="nav-link" href="#home" data-bs-dismiss="offcanvas">Home</a></li>
              <li class="nav-item"><a class="nav-link" href="#about" data-bs-dismiss="offcanvas">About</a></li>
              <li class="nav-item"><a class="nav-link" href="#how-it-works" data-bs-dismiss="offcanvas">How it Works</a></li>
              <li class="nav-item"><a class="nav-link" href="#episodes" data-bs-dismiss="offcanvas">Episodes</a></li>
            </ul>
              <a href="https://podcast-waitlist.netlify.app/" class="btn btn-primary mt-3 signup-link">Sign up</a>
          </div>
        </div>
  
  <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js" integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js" integrity="sha384-G/EV+4j2dNv+tEPo3++6LCgdCROaejBqfUeNjuKAiuXbjrxilcCdDz6ZAVfHWe1Y" crossorigin="anonymous"></script>
  <script>
    const offcanvasEl = document.getElementById('mobileNav');
    const offcanvas = bootstrap.Offcanvas.getInstance(offcanvasEl) || new bootstrap.Offcanvas(offcanvasEl);

    document.querySelectorAll('#mobileNav a').forEach(link => {
    link.addEventListener('click', (e) => {
      const href = link.getAttribute('href');

      if (href.startsWith('#')) {
      e.preventDefault(); 
      const target = document.querySelector(href);
      offcanvas.hide();

      offcanvasEl.addEventListener('hidden.bs.offcanvas', () => {
        target.scrollIntoView({ behavior: 'smooth' });
      }, { once: true });
    }
  });
  });
  </script>
</body>
</html>
